<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard - Daliya Marketing</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f9f9f9; padding: 20px; max-width: 600px; margin: auto; text-align: center; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #1e824c; padding-bottom: 10px; margin-bottom: 40px; }
        h1 { color: #1e824c; margin: 0; font-size: 24px; }
        .logout-btn { background: #dc3545; color: white; text-decoration: none; padding: 8px 15px; border-radius: 4px; font-weight: bold; font-size: 14px; }
        
        .menu-container { display: flex; flex-direction: column; gap: 20px; margin-top: 20px; }
        .menu-btn { display: block; background: #28a745; color: white; text-decoration: none; padding: 20px; border-radius: 8px; font-size: 18px; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.05); transition: background 0.2s; }
        .menu-btn:hover { background: #218838; }
    </style>
</head>
<body>

<div class="header">
    <h1>Daliya Admin Panel</h1>
    <a href="/admin/logout" class="logout-btn">Logout</a>
</div>

<h2>കൺട്രോൾ പാനൽ മെനു</h2>
<p style="color: #666; margin-bottom: 30px;">നിങ്ങൾക്ക് ചെയ്യേണ്ട കാര്യം താഴെ നിന്നും തിരഞ്ഞെടുക്കുക:</p>

<div class="menu-container">
    <a href="/admin/brand" class="menu-btn">➕ പുതിയ ബ്രാൻഡ് ചേർക്കുക (Add Brand)</a>
    <a href="/admin/product" class="menu-btn">📦 പുതിയ ഉൽപ്പന്നം ചേർക്കുക (Add Product)</a>
</div>

</body>
</html>
